<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Laboratório interativo de teoria dos autômatos: editor visual, simulação, gramáticas e expressões regulares."><title>Automata Lab — Laboratório de autômatos</title><link rel="stylesheet" href="style.css?v=afce50d"></head><body>
<aside class="sidebar"><a class="logo" href="#"><span class="logo-mark">a<span>→</span></span><b>automata<span>lab</span></b></a><p class="side-label" data-i18n="workspace"></p><nav id="nav"></nav><p class="side-label" data-i18n="learn"></p><button class="nav-item" id="library"><span>▦</span><span data-i18n="library"></span></button><button class="nav-item" id="guide"><span>▤</span><span data-i18n="guide"></span></button><div class="sidebar-bottom"><span class="green-dot"></span><span data-i18n="saved"></span><p data-i18n="local"></p><small>Automata Lab · 1.0</small></div></aside>
<div class="main"><header><div class="breadcrumb"><span data-i18n="workspace"></span><span>/</span><b id="crumb"></b></div><div class="header-right"><select id="language" aria-label="Idioma / Language"><option value="pt">🇧🇷 Português</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="zh">🇨🇳 中文</option><option value="hi">🇮🇳 हिन्दी</option></select></div></header>
<main><div class="page-heading"><div><div class="eyebrow">AUTOMATA LAB <span>•</span> <span data-i18n="brand"></span></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="page-actions"><button id="tools" data-i18n="tools"></button><button id="new" data-i18n="new"></button><button id="import">↥ <span data-i18n="import"></span></button><button class="primary" id="export">↧ <span data-i18n="export"></span></button></div></div>
<div id="symbolic" class="card symbolic" hidden><label id="symbolic-label" for="expression"></label><textarea id="expression" spellcheck="false"></textarea><p id="symbolic-help"></p><button class="primary" id="build" data-i18n="build"></button></div>
<div class="workspace-grid"><section class="card editor-card"><div class="card-heading"><div class="tabs"><button class="tab active" id="editorTab" data-i18n="editor"></button><button class="tab" id="tableTab" data-i18n="matrix"></button></div><div class="conversion"><button id="convert" data-i18n="convert"></button><button id="minimize" data-i18n="minimize"></button></div></div><div id="canvasWrap"><div class="canvas-toolbar"><div class="tool-group"><button id="selectTool" class="tool active" data-title="select">↖</button><button id="addTool" class="tool" data-title="add">＋</button><button id="panTool" class="tool" data-title="pan">✥</button><button id="connectTool" class="tool" data-title="connect">↗</button></div><div class="tool-group"><button class="tool" id="undo" data-title="undo">↶</button><button class="tool" id="redo" data-title="redo">↷</button><button class="tool" id="fit" data-title="fit">⊞</button></div><button id="clearEditor" class="clear-editor" data-i18n="clearEditor"></button></div><div class="canvas-view-tools"><div class="tool-group"><button class="tool" id="zoomOut" data-title="zoomOut">−</button><button id="zoomReset" class="zoom-level" data-title="zoomReset">100%</button><button class="tool" id="zoomIn" data-title="zoomIn">＋</button><button class="tool" id="fitView" data-title="fitView">⛶</button></div><button id="focusEditor" class="tool" data-title="focusEditor">⤢</button></div><div id="contextMenu" class="context-menu" role="dialog" aria-labelledby="contextTitle" hidden><div class="context-head"><b id="contextTitle"></b><button id="closeContext" data-title="close">×</button></div><div id="inspector"></div></div><svg id="canvas" viewBox="0 0 980 560" role="group" aria-label="Editor de autômatos" tabindex="0"></svg><div class="canvas-help" id="canvasHelp"></div><div class="canvas-badge" id="modelBadge">AFD</div></div><div id="tableWrap" hidden></div><footer class="editor-footer"><span><i class="green-dot"></i> <span id="stats"></span></span><div class="canvas-playback"><input id="quickWord" value="1011" maxlength="200" autocomplete="off" spellcheck="false" data-title="input"><button id="quickAnimate" data-title="animate">▶</button><button id="quickStep" data-title="step">▷</button><button id="quickReset" data-title="reset">↺</button><span id="quickResult" role="status"></span></div><span>Σ = <b id="sigma"></b></span></footer></section>
</div>
<section class="card simulation"><div class="section-title"><span class="purple-icon">▷</span><h2 data-i18n="simulator"></h2><span class="tag" id="simTag">AFD</span></div><div class="sim-grid"><div><label for="word" data-i18n="input"></label><div class="input-row"><input id="word" value="1011" autocomplete="off" spellcheck="false" maxlength="200"><button class="primary" id="run">▶ <span data-i18n="run"></span></button></div><div class="step-controls"><button id="animate">▶ <span data-i18n="animate"></span></button><select id="animationSpeed" data-title="speed"><option value="1100">0.5×</option><option value="650" selected>1×</option><option value="300">2×</option></select><button id="step">▷ <span data-i18n="step"></span></button><button id="reset">↺ <span data-i18n="reset"></span></button><span id="stepCount"></span></div></div><div class="result-area"><div id="result" class="result ready"></div><div id="tape" class="tape"></div><div id="config" class="config"></div></div><div class="batch-area"><label for="batchWords" data-i18n="batch"></label><textarea id="batchWords" rows="3" spellcheck="false">11
1011
100
ε</textarea><small data-i18n="onePerLine"></small><button id="batchRun" data-i18n="run"></button><div id="batchResults"></div></div></div></section><div class="bottom-caption"><span>◈ Automata Lab</span><span data-i18n="local"></span></div></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Fechar / Close">×</button></div><div id="dialogBody"></div></dialog><input id="file" type="file" accept=".json,.jff,.xml" hidden><div id="toast" role="status" hidden></div><script type="module" src="app.js?v=afce50d"></script></body></html>
